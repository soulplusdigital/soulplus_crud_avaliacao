<div class="container">
  <header>
    <h1>Lista de Clientes</h1>
    <button class="btn-novo" (click)="novoCliente()">Novo Cliente</button>
  </header>

  <div class="tabela-container">
    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Nome</th>
          <th>Telefone</th>
          <th>Perfil</th>
          <th>Foto</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of clientes">
          <td>{{ cliente.id }}</td>
          <td>{{ cliente.nome }}</td>
          <td>{{ cliente.telefone }}</td>
          <td>{{ cliente.perfil }}</td>
          <td>
            <img class="foto-cliente" [src]="cliente.urlFoto" alt="Foto de {{ cliente.nome }}">
          </td>
          <td class="acoes">
            <button class="btn-editar"(click)="editarCliente(cliente)">Editar</button>
            <button class="btn-excluir" (click)="confirmarExclusao(cliente.id)">Excluir</button>
          </td>
        </tr>
        <tr *ngIf="clientes.length === 0">
          <td colspan="6" class="sem-registros">Nenhum cliente cadastrado</td>
        </tr>
      </tbody>
    </table>
  </div>

   <!-- Modal de detalhes do cliente -->
   <app-detalhes-cliente
      *ngIf="mostrarModal"
      [cliente]="clienteSelecionado"
      [modoEdicao]="modoEdicao"
      (salvar)="salvarCliente($event)"
      (cancelar)="fecharModal()">
  </app-detalhes-cliente>

   <!-- Modal de confirmação de exclusão  -->
   <div class="modal-overlay" *ngIf="mostrarConfirmacaoExclusao">
    <div class="modal-confirmacao">
      <h3>Confirmação</h3>
      <p>Tem certeza que deseja excluir este cliente?</p>
      <div class="botoes-confirmacao">
        <button class="btn-confirmar" (click)="excluirCliente()">Confirmar</button>
        <button class="btn-cancelar" (click)="cancelarExclusao()">Cancelar</button>
      </div>
    </div>
  </div>
</div>
